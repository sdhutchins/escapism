<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escapism</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>
    <script>
        // Only load p5.sound if we're on http/https (not file://)
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
            const soundScript = document.createElement('script');
            soundScript.src = 'https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/addons/p5.sound.min.js';
            document.head.appendChild(soundScript);
        }
    </script>
</head>
<body>
    <main>
        <div id="canvas-container"></div>
        <div class="time-dial" id="time-dial">
            <div class="time-dial__window" aria-hidden="true">
                <div class="time-dial__ruler">
                    <span class="time-dial__mood time-dial__mood--day">☀</span>
                    <span class="time-dial__mood time-dial__mood--sunset">◒</span>
                    <span class="time-dial__mood time-dial__mood--night">☾</span>
                </div>
            </div>
            <span class="time-dial__marker" aria-hidden="true"></span>
            <input type="range" id="time-control" min="0" max="2" step="0.5" value="0"
                aria-label="Time of day" aria-valuetext="Day"
                title="Drag to change the time of day, or use arrow keys">
        </div>
        <section class="audio-player" aria-label="Audio controls">
            <p class="audio-player__label">Now playing</p>
            <div class="audio-player__track">
                <p class="audio-player__song" id="current-song">Daydreaming</p>
                <p class="audio-player__artist" id="current-artist">NxWorries, Anderson .Paak, Knxwledge</p>
            </div>
            <div class="audio-player__controls">
                <button type="button" id="previous-track" class="audio-player__icon-button" aria-label="Play previous song" title="Previous">
                    <span aria-hidden="true">⏮</span>
                </button>
                <button type="button" id="play-track" class="audio-player__icon-button" aria-label="Play current song" title="Play or pause">
                    <span id="play-icon" aria-hidden="true">▶</span>
                </button>
                <button type="button" id="next-track" class="audio-player__icon-button" aria-label="Play next song" title="Next">
                    <span aria-hidden="true">⏭</span>
                </button>
                <button type="button" id="mute-track" class="audio-player__icon-button" aria-label="Mute audio" title="Mute or unmute">
                    <span id="mute-icon" aria-hidden="true">🔊</span>
                </button>
                <label class="audio-player__volume" for="volume-control">
                    <span class="audio-player__volume-label">Volume</span>
                    <input
                        type="range"
                        id="volume-control"
                        min="0"
                        max="1"
                        step="0.05"
                        value="0.1"
                        aria-label="Adjust volume"
                    >
                </label>
            </div>
        </section>
    </main>
    <script src="sketch.js"></script>
</body>
</html>
